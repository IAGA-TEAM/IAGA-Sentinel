# ponytail: minimal ghcr.io publish. Builds the existing Dockerfile and pushes
# on tag. No build matrix, no cargo-dist, no crates.io — Docker already covers
# the Packages tab AND users without Rust. Add other artifacts only if someone
# actually needs a non-Docker one.
name: docker

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # ghcr.io requires a lowercase image name; hardcoded so it never
          # depends on the repo owner's casing. ref_name on a tag push is e.g. v1.6.0.
          #
          # STATE OF THIS, MEASURED ON 2026-08-05 RATHER THAN ASSUMED. The comment
          # that used to sit here claimed CI had published to `ghcr.io/iaga-team`
          # since 1.9.0. It has not: the organisation has **no packages at all**,
          # and the only published image is `ghcr.io/edoardobambini/iaga-sentinel`,
          # whose newest tag is v1.8.1 (measured 2026-08-09 against the registry:
          # tags = main, latest, v1.7.0-v1.7.2, v1.8.0, v1.8.1 — not the 1.6 line an
          # earlier revision of this comment claimed). On the v2.0.1 tag this step
          # uploaded every layer and then failed the manifest with HTTP 403.
          #
          # A 403 at manifest time, after the blobs went through, is a permission
          # to *own the package*, not a permission to write blobs. `permissions:
          # packages: write` above is already set, so the remaining causes are
          # organisation-side and cannot be fixed from this file:
          #   * Org Settings -> Packages -> package creation may be disabled, so
          #     GITHUB_TOKEN cannot create a package that does not exist yet.
          #   * Org Settings -> Actions -> Workflow permissions may cap what a
          #     workflow token can request.
          # Once the package exists, its own "Manage Actions access" list must
          # include this repository with the Write role.
          #
          # Until that is settled, no `ghcr.io/iaga-team/...` tag resolves, so do
          # not point users at one.
          tags: |
            ghcr.io/iaga-team/iaga-sentinel:${{ github.ref_name }}
            ghcr.io/iaga-team/iaga-sentinel:latest
