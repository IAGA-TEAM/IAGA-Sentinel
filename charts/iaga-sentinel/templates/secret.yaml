{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "iaga-sentinel.fullname" . }}
  labels:
    {{- include "iaga-sentinel.labels" . | nindent 4 }}
type: Opaque
data:
  {{- with .Values.secrets.receiptSignerKey }}
  {{- if ne (len .) 44 }}
  {{- fail "secrets.receiptSignerKey must be the base64 encoding of a raw 32-byte Ed25519 seed (44 characters). It is no longer hex: a 64-char hex string is itself valid base64, so it would be accepted here and then decode to 48 bytes, silently disabling receipts. Generate one with: head -c 32 /dev/urandom | base64" }}
  {{- end }}
  receipt-signer-key: {{ . }}
  {{- end }}
  {{- with .Values.secrets.nhiMasterSeed }}
  nhi-master-seed: {{ . | b64enc }}
  {{- end }}
  {{- with .Values.secrets.bootstrapApiKey }}
  bootstrap-api-key: {{ . | b64enc }}
  {{- end }}
  {{- if .Values.postgres.enabled }}
  {{- if and .Values.postgres.url (not .Values.postgres.existingSecret) }}
  database-url: {{ .Values.postgres.url | b64enc }}
  {{- end }}
  {{- end }}
{{- end }}
