# IAGA Sentinel - Policy Configuration Example
# Copy this to iaga-sentinel.yaml and customize for your environment.
# The server auto-imports this file on first boot.

profiles:
  - agentId: builder-01
    workspaceId: ws-default
    framework: langchain
    role: builder
    approvedTools:
      - file.read
      - file.write
      - terminal.exec
    approvedSecrets:
      - OPENAI_API_KEY
    baselineActionTypes:
      - file_read
      - file_write
      - shell

  - agentId: researcher-01
    workspaceId: ws-default
    framework: crewai
    role: researcher
    approvedTools:
      - http.fetch
      - file.read
    approvedSecrets: []
    baselineActionTypes:
      - http
      - file_read

  - agentId: operator-01
    workspaceId: ws-default
    framework: mcp
    role: operator
    approvedTools:
      - db.query
      - http.fetch
      - terminal.exec
    approvedSecrets:
      - DATABASE_URL
      - OPENAI_API_KEY
    baselineActionTypes:
      - db_query
      - http
      - shell

workspaces:
  - workspaceId: ws-default
    allowedProtocols:
      - mcp
      - http-function
    # Bare hosts, matched for equality against the destination's host after
    # normalisation. There is NO wildcard support: this list used to read
    # `*.openai.com` / `*.github.com`, which match nothing, so anyone who copied
    # this file had every call to those hosts blocked by the egress rule. List
    # each host you actually call.
    allowedDomains:
      - "api.openai.com"
      - "api.anthropic.com"
      - "api.github.com"
    tools:
      - toolName: file.read
        allowedActionTypes:
          - file_read
        maxDecision: allow
        requiresHumanReview: false

      - toolName: file.write
        allowedActionTypes:
          - file_write
        maxDecision: review
        requiresHumanReview: false

      - toolName: terminal.exec
        allowedActionTypes:
          - shell
        maxDecision: review
        requiresHumanReview: true

      # `destinationFields` names the payload keys that carry this tool's egress
      # target. Declaring them makes the domain allowlist FAIL CLOSED: a payload
      # that exposes none of these keys is refused rather than quietly skipping
      # the allowlist. Without the declaration only `destination`/`url`/
      # `endpoint`/`href` are probed, so a caller naming its target `target` or
      # `uri` slips past the check entirely.
      #
      # Declare it only for tools whose destination really is caller-supplied.
      # An LLM SDK call (`openai.chat.completions.create`) has its endpoint baked
      # into the client, so declaring there would refuse every legitimate call.
      - toolName: http.fetch
        allowedActionTypes:
          - http
        maxDecision: allow
        requiresHumanReview: false
        destinationFields:
          - destination
          - url
          - uri
          - endpoint
          - href
          - target

      - toolName: db.query
        allowedActionTypes:
          - db_query
        maxDecision: review
        requiresHumanReview: false

vault: []
