          description: Per-agent rows, or `enabled:false` without cost-control
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CostRowsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AdminScopeRequired"

  /v1/cost/by-model:
    get:
      operationId: getCostByModel
      summary: Spend aggregated per provider/model
      tags: [Cost]
      parameters:
        - $ref: "#/components/parameters/FromDate"
        - $ref: "#/components/parameters/ToDate"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Per-model rows, or `enabled:false` without cost-control
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CostRowsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/cost/by-tool:
    get:
      operationId: getCostByTool
      summary: Spend aggregated per tool
      tags: [Cost]
      parameters:
        - $ref: "#/components/parameters/FromDate"
        - $ref: "#/components/parameters/ToDate"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Per-tool rows, or `enabled:false` without cost-control
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CostRowsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/cost/over-time:
    get:
      operationId: getCostOverTime
      summary: Spend bucketed over time
      tags: [Cost]
      parameters:
        - $ref: "#/components/parameters/FromDate"
        - $ref: "#/components/parameters/ToDate"
        - name: bucket
          in: query
          schema:
            type: string
            enum: [hour, day]
            default: hour
      responses:
        "200":
          description: Time-bucketed rows, or `enabled:false` without cost-control
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CostOverTimeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/cost/budget:
    get:
      operationId: getCostBudget
      summary: Configured per-session budget
      tags: [Cost]
      responses:
        "200":
          description: Budget configuration, or `enabled:false` without cost-control
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CostBudgetResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/cost/pricing:
    get:
      operationId: getCostPricing
      summary: Active pricing table (built-in or operator-supplied)
      tags: [Cost]
      responses:
        "200":
          description: Pricing table, or `enabled:false` without cost-control
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CostPricingResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ── Pillar status surfaces ──
  /v1/policy/overlay:
    get:
      operationId: getPolicyOverlayStatus
      summary: Dictum live policy overlay status (M6)
      tags: [PolicyOverlay]
      responses:
        "200":
          description: Overlay status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyOverlayStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/reasoning/status:
    get:
      operationId: getReasoningStatus
      summary: ML reasoning plane status (M3.5)
      tags: [Reasoning]
      responses:
        "200":
          description: Reasoning engine and loaded model digests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReasoningStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/kernel/status:
    get:
      operationId: getKernelStatus
      summary: Enforcement kernel posture (M4)
      tags: [Kernel]
      responses:
        "200":
          description: Kernel backend and authoritativeness (honest posture)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KernelStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >
        API key passed as a Bearer token. Generate keys via POST /v1/auth/keys.

  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Unique resource identifier
    ReviewId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Review request identifier
    AgentId:
      name: agent_id
      in: path
      required: true
      schema:
        type: string
      description: Agent identifier
    WorkspaceId:
      name: workspace_id
      in: path
      required: true
      schema:
        type: string
      description: Workspace identifier
    FromDate:
      name: from_date
      in: query
      required: false
      schema:
        type: string
        format: date-time
      description: Inclusive lower bound on the event timestamp
    ToDate:
      name: to_date
      in: query
      required: false
      schema:
        type: string
        format: date-time
      description: Inclusive upper bound on the event timestamp
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        default: 20
      description: Maximum number of rows returned

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Authentication required or invalid API key
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: >-
        Policy violation, or a scope the caller is not entitled to assert
        (`scope_mismatch`, `agent_scope_mismatch`, or `agent_key_unbound`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    AdminScopeRequired:
      description: >
        The presented API key has `agent` scope; this operation requires an
        `admin`-scoped key (error code `admin_scope_required`, 1.5.2).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    CapabilityRequired:
      description: >
        Neither an `admin`-scoped key nor a capability token granting the
        required capability for this agent (error code `capability_required`,
        2.1.0). Present a token in the `X-IAGA-Capability-Token` header. An
        agent-scoped API key must also be bound to the same agent; a capability
        token never widens the key's identity.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    # ── Taint correlation scope ──
    TaintCorrelationScope:
      type: object
      description: >-
        What the multi-step correlation behind this verdict was actually keyed
        on. Present on every response that ran the taint layer.


        This block is a stated LIMITATION, not a feature. `sessionId` is chosen
        by the caller, so an agent that rotates it between reading a credential
        and sending it out produces two uncorrelated verdicts, and nothing else
        in the response says so. A reader who is told the basis can judge what
        the verdict does not cover.


        Set `IAGA_SENTINEL_TAINT_AGENT_WINDOW_SECS` to also correlate across one
        agent's sessions within a window. `agentId` is client-declared too, so
        that raises the bar from rotating one field to rotating two rather than
        closing the gap; binding `sessionId` to an NHI identity is the fix that
        would, and it does not exist yet. Only the `secret` label crosses a
        session boundary, and only into a request carrying a body — folding in
        every label blocked ordinary read-then-fetch work in measurement.


        The aggregation store is in-memory and per-process: it does not survive
        a restart and does not span replicas.
      required: [basis, sessionIdSource, aggregatedByAgent, caveat]
      properties:
        basis:
          type: string
          enum: ["session", "session+agent"]
          example: "session"
        sessionIdSource:
          type: string
          description: >-
            Whether the session key came from the caller or was defaulted to
            `agentId` because no `metadata.sessionId` was supplied.
          example: "client-declared metadata.sessionId"
        aggregatedByAgent:
          type: boolean
          example: false
        agentWindowSecs:
          type: integer
          description: Present only when aggregation is enabled.
          example: 900
        caveat:
          type: string
          description: Plain-language statement of what this verdict does not cover.

    # ── Error ──
    ErrorResponse:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          description: Machine-readable error code
          enum:
            - agent_not_found
            - workspace_not_found
            - policy_violation
            - storage_error
            - auth_required
            - invalid_api_key
            - admin_scope_required
            - scope_mismatch
            - agent_scope_mismatch
            - agent_key_unbound
            - invalid_request
            - review_not_found
            - not_found
            - capability_required
            - internal_error
            - config_error
            - io_error
            - proxy_error
        message:
          type: string
          description: Human-readable error message

    # ── Health ──
    HealthResponse:
      type: object
      required: [ok, service, mode, version, authRequired, openMode, apiKeysConfigured]
      properties:
        ok:
          type: boolean
        service:
          type: string
          example: iaga-sentinel
        mode:
          type: string
          example: gateway
        version:
          type: string
          example: 2.0.0
        authRequired:
          type: boolean
          description: True unless open mode is on and no keys exist
        openMode:
          type: boolean
          description: IAGA_SENTINEL_OPEN_MODE=true
        apiKeysConfigured:
          type: boolean

    # ── Enums ──
    ProtocolKind:
      type: string
      enum: [mcp, acp, a2a, http-function, unknown]
      description: Agent communication protocol

    ActionType:
      type: string
      enum: [shell, file_read, file_write, http, db_query, email, custom]
      description: Category of tool action

    GovernanceDecision:
      type: string
      enum: [allow, review, block]
      description: Governance pipeline decision

    ReviewStatus:
      type: string
      enum: [not_required, pending, approved, rejected]
      description: Human review status

    AgentRole:
      type: string
      enum: [builder, researcher, operator]
      description: Agent role classification

    ReviewAction:
      type: string
      enum: [approved, rejected]
      description: Action to take on a review

    # ── Core Request / Response ──
    ActionDetail:
      type: object
      required: [type, toolName, payload]
      properties:
        type:
          $ref: "#/components/schemas/ActionType"
        toolName:
          type: string
          description: Name of the tool being invoked
        payload:
          type: object
          additionalProperties: true
          description: Arbitrary tool parameters

    InspectRequest:
      type: object
      required: [agentId, framework, action]
      properties:
        agentId:
          type: string
          description: Unique agent identifier
        tenantId:
          type: string
          description: >-
            Ignored. The tenant is derived server-side from the agent profile,
            falling back to the workspace policy. Accepted for wire
            compatibility; any supplied value is discarded and never reaches the
            audit event.
        workspaceId:
          type: string
          description: >-
            Optional assertion of the agent's workspace. The workspace is
            derived server-side from the agent profile; if this field is present
            and non-empty it must match, otherwise the request is rejected with
            403 `scope_mismatch`. Omit it unless you want the server to check
            your assumption.
        framework:
          type: string
          description: Agent framework name (e.g. langchain, autogen)
        protocol:
          $ref: "#/components/schemas/ProtocolKind"
        action:
          $ref: "#/components/schemas/ActionDetail"
        requestedSecrets:
          type: array
          items:
            type: string
          description: Secret names the agent wants injected
        metadata:
          type: object
          additionalProperties: true
          description: Arbitrary key-value metadata (e.g. `sessionId` for session correlation)
        usage:
          $ref: "#/components/schemas/UsageReport"

    UsageReport:
      type: object
      required: [provider, model]
      description: >
        1.5 cost-control: optional usage reported alongside the action, priced
        server-side into the receipt and audit cost ledger. A caller-supplied
        `costUsd` always wins over the server's pricing table.
      properties:
        provider:
          type: string
          example: anthropic
        model:
          type: string
          example: claude-sonnet-4-6
        promptTokens:
          type: integer
        completionTokens:
          type: integer
        totalTokens:
          type: integer
        costUsd:
          type: number
          format: double
          description: Caller-asserted cost in USD (overrides the pricing table)

    RiskScore:
      type: object
      required: [score, decision, reasons]
      properties:
        score:
          type: integer
          minimum: 0
          maximum: 100
          description: Numeric risk score (0-100)
        decision:
          $ref: "#/components/schemas/GovernanceDecision"
        reasons:
          type: array
          items:
            type: string

    SecretInjectionPlan:
      type: object
      required: [approved, denied]
      properties:
        approved:
          type: array
          items:
            type: string
        denied:
          type: array
          items:
            type: string

    SchemaValidation:
      type: object
      required: [toolName, valid, findings]
      properties:
        toolName:
          type: string
        valid:
          type: boolean
        findings:
          type: array
          items:
            type: string

    AuditEvent:
      type: object
      required: [eventId, agentId, framework, actionType, toolName, decision, timestamp, reasons]
      properties:
        eventId:
          type: string
          format: uuid
        agentId:
          type: string
        framework:
          type: string
        actionType:
          $ref: "#/components/schemas/ActionType"
        toolName:
          type: string
        decision:
          $ref: "#/components/schemas/GovernanceDecision"
        timestamp:
          type: string
          format: date-time
        reasons:
          type: array
          items:
            type: string

    StoredAuditEvent:
      type: object
      required: [eventId, agentId, framework, actionType, toolName, decision, timestamp, reasons, reviewStatus, riskScore]
      properties:
        eventId:
          type: string
          format: uuid
        agentId:
          type: string
        framework:
          type: string
        actionType:
          $ref: "#/components/schemas/ActionType"
        toolName:
          type: string
        decision:
          $ref: "#/components/schemas/GovernanceDecision"
        timestamp:
          type: string
          format: date-time
        reasons:
          type: array
          items:
            type: string
        reviewStatus:
          $ref: "#/components/schemas/ReviewStatus"
        riskScore:
          type: integer
          minimum: 0
        usage:
          type: object
          additionalProperties: true
          description: >
            1.5 cost-control: canonical usage/cost record (camelCase
            `UsageData`, integer micro-USD ledger). Absent when no usage was
            reported for the action.

    GovernanceResult:
      type: object
      required:
        - protocol
        - normalizedPayload
        - decision
        - reviewStatus
        - risk
        - secretPlan
        - auditEvent
        - profile
        - workspacePolicy
        - policyFindings
        - schemaValidation
      properties:
        protocol:
          $ref: "#/components/schemas/ProtocolKind"
        normalizedPayload:
          type: object
          additionalProperties: true
        decision:
          $ref: "#/components/schemas/GovernanceDecision"
        reviewStatus:
          $ref: "#/components/schemas/ReviewStatus"
        risk:
          $ref: "#/components/schemas/RiskScore"
        secretPlan:
          $ref: "#/components/schemas/SecretInjectionPlan"
        auditEvent:
          $ref: "#/components/schemas/AuditEvent"
        profile:
          $ref: "#/components/schemas/AgentProfile"
        workspacePolicy:
          $ref: "#/components/schemas/WorkspacePolicy"
        policyFindings:
          type: array
          items:
            type: string
        schemaValidation:
          $ref: "#/components/schemas/SchemaValidation"
        reviewRequestId:
          type: string
          format: uuid
        sessionGraph:
          description: >-
            L1 session graph data. VETO — its attack signatures can force a
            verdict on their own. Its `advisoryScore` cannot.
        taintAnalysis:
          description: >-
            L2 taint tracking data. VETO. Carries `correlationScope`, which
            states what the multi-step correlation was keyed on: by default the
            client-declared `metadata.sessionId`, so a caller that rotates that
            id between steps is NOT correlated across them. Read it before
            treating a single `allow` as evidence about a chain.
          type: object
          properties:
            correlationScope:
              $ref: "#/components/schemas/TaintCorrelationScope"
        adaptiveRisk:
          description: >-
            L4 adaptive risk scoring data. SCORING — contributes to the
            composite and can escalate to review. It has no score-driven block
            arm: at its default weights the signed ceiling of its four signals is
            below the block threshold, so `decision: "block"` here comes only
            from the categorical exfiltration override. Admin feedback
            (POST /v1/risk/feedback) re-normalises those weights and can lift the
            ceiling, but still cannot block, because the decision carries no score
            arm to reach. Its `advisory` array is excluded from the signed score
            entirely.
        sandboxResult:
          description: >-
            L5 sandbox execution result. ADVISORY — the composite risk formula
            has no sandbox term, so nothing here moves a verdict. It is
            containment and reporting.
        injectionFirewall:
          description: L7 injection firewall analysis. VETO.
        policyVerification:
          description: >
            L6 formal policy verification result. ADVISORY - it lints the
            WORKSPACE POLICY, not the request. `execute_pipeline` computes it,
            serializes it and never reads it back, so no issue it reports - at
            any severity - changes a verdict. `policyFindings` is the arm that
            judges the request and vetoes.
        telemetrySpan:
          description: L8 telemetry span reference. ADVISORY.
        behavioralFingerprint:
          description: >-
            ADVISORY — risk contribution pinned to 0 (DET-BEHAVIORAL-2), because
            it derives from process-global mutable state a receipt cannot
            reproduce. Reported, never decisive.
        advisory:
          description: >-
            ADVISORY — signals excluded from the signed verdict by construction
            (D1), so the receipt stays reproducible from its recorded inputs.
            Absent when nothing fired.
        layerRoles:
          description: >-
            Machine-readable role for each layer block above: `veto` (can force
            a decision), `scoring` (contributes a term to the composite), or
            `advisory` (reported, never decisive). Published because a response
            listing ten layer blocks otherwise reads as ten defences, and four
            of them cannot move a verdict by construction: `sandboxResult`,
            `behavioralFingerprint`, `telemetrySpan` and `policyVerification`.
            Note `sessionGraph.advisoryScore` is a sub-field, not one of the
            ten.

    # ── Reviews ──
    ReviewRequest:
      type: object
      required: [id, agentId, workspaceId, toolName, decision, status, riskScore, reasons, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        agentId:
          type: string
        workspaceId:
          type: string
        toolName:
          type: string
        decision:
          $ref: "#/components/schemas/GovernanceDecision"
        status:
          type: string
          description: Current review status (pending, approved, rejected)
        riskScore:
          type: integer
          minimum: 0
        reasons:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ReviewBody:
      type: object
      required: [status]
      properties:
        status:
          $ref: "#/components/schemas/ReviewAction"

    # ── Profiles & Policies ──
    AgentProfile:
      type: object
      required: [agentId, workspaceId, framework, role, approvedTools, approvedSecrets, baselineActionTypes]
      properties:
        agentId:
          type: string
        workspaceId:
          type: string
        framework:
          type: string
        role:
          $ref: "#/components/schemas/AgentRole"
        approvedTools:
          type: array
          items:
            type: string
        approvedSecrets:
          type: array
          items:
            type: string
        baselineActionTypes:
          type: array
          items:
            $ref: "#/components/schemas/ActionType"
        tenantId:
          type: string
          nullable: true
        toolTrust:
          type: number
          format: double
          minimum: 0
          maximum: 1
          default: 0.7
          description: >
            Per-agent trust multiplier applied to the tool-risk layer. Persisted
            since migration 0006. Same PUT hazard as the workspace thresholds:
            the field has a serde default, so a body that omits it resets the
            agent to 0.7 with 200 OK and no warning.

    ToolPolicy:
      type: object
      required: [toolName, allowedActionTypes, maxDecision]
      properties:
        toolName:
          type: string
        allowedActionTypes:
          type: array
          items:
            $ref: "#/components/schemas/ActionType"
        maxDecision:
          $ref: "#/components/schemas/GovernanceDecision"
        requiresHumanReview:
          type: boolean
          default: false
        destinationFields:
          type: array
          default: []
          items:
            type: string
          description: >-
            Payload keys carrying this tool's egress destination, in priority
            order. Declaring them makes the workspace domain allowlist
            fail-closed FOR THIS TOOL: a payload exposing none of these keys is
            blocked rather than silently skipping the domain check.


            Leave empty for a tool whose destination is not caller-controlled —
            an LLM SDK call such as `openai.chat.completions.create` is an
            `http` action whose destination lives in the SDK, and declaring
            fields for it would block every call. That is per-tool information,
            which is why this lives here and not on the action type.


            Undeclared tools keep the legacy fixed probe
            (`destination`/`url`/`endpoint`/`href`), which skips the allowlist
            when it finds nothing. An `http` action that reaches that fallback
            and still shows an unallowlisted host in some other key is escalated
            to review, never blocked.

    WorkspacePolicy:
      type: object
      required: [workspaceId, allowedProtocols, tools, allowedDomains]
      properties:
        workspaceId:
          type: string
        tenantId:
          type: string
          nullable: true
        allowedProtocols:
          type: array
          items:
            $ref: "#/components/schemas/ProtocolKind"
        tools:
          type: array
          items:
            $ref: "#/components/schemas/ToolPolicy"
        allowedDomains:
          type: array
          items:
            type: string
        thresholdBlock:
          type: integer
          minimum: 0
          maximum: 100
          default: 70
          description: >
            Composite risk score at or above which the verdict is `block`.
            OMITTING THIS ON A PUT RESETS IT TO 70. The handler replaces the
            whole policy, and the field has a serde default, so a body built
            without it silently un-hardens a workspace that had been tightened
            — with 200 OK and no warning. Always send the value you read back.
        thresholdReview:
          type: integer
          minimum: 0
          maximum: 100
          default: 35
          description: >
            Composite risk score at or above which the verdict is `review`.
            Same PUT hazard as `thresholdBlock`: omitting it resets it to 35.

    # ── Auth ──
    KeyScope:
      type: string
      enum: [admin, agent]
      description: >
        API-key scope. `admin` (default) has full access; `agent` may drive
        the governance surface only as the `agentId` bound when the key was
        created, and may not manage keys, webhooks, rate-limit config, threat
        intel, or plugins.

    ApiKeyRecord:
      type: object
      required: [id, label, createdAt, scope, agentId]
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
        createdAt:
          type: string
          format: date-time
        scope:
          $ref: "#/components/schemas/KeyScope"
        agentId:
          type: string
          nullable: true
          description: Bound identity for an agent-scoped key; null for admin keys

    CreateApiKeyBody:
      type: object
      required: [label]
      properties:
        label:
          type: string
          description: Human-readable label for the key
        scope:
          $ref: "#/components/schemas/KeyScope"
        agentId:
          type: string
          description: Required and non-empty when `scope` is `agent`; rejected for admin keys

    ApiKeyCreated:
      type: object
      required: [id, key, label, scope, agentId]
      properties:
        id:
          type: string
          format: uuid
        key:
          type: string
          description: Raw API key (shown only once)
        label:
          type: string
        scope:
          $ref: "#/components/schemas/KeyScope"
        agentId:
          type: string
          nullable: true
          description: Bound identity for an agent-scoped key; null for admin keys

    # ── Webhooks ──
    WebhookConfig:
      type: object
      required: [id, url, secret, eventFilter, createdAt, active]
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
          format: uri
        secret:
          type: string
        eventFilter:
          type: array
          items:
            type: string
            enum: [action_governed, review_created, review_resolved]
          description: Event types to receive. Empty array means all events.
        createdAt:
          type: string
          format: date-time
        active:
          type: boolean

    CreateWebhookBody:
      type: object
      required: [url, secret]
      properties:
        url:
          type: string
          format: uri
        secret:
          type: string
          description: Shared secret for HMAC-SHA256 signature verification
        event_filter:
          type: array
          items:
            type: string
          default: []

    # ── Sessions (L1) ──
    SessionInfo:
      type: object
      properties:
        sessionId:
          type: string
        agentId:
          type: string
        startedAt:
          type: string
          format: date-time
        nodeCount:
          type: integer
        edgeCount:
          type: integer

    SessionMetrics:
      type: object
      properties:
        sessionId:
          type: string
        totalActions:
          type: integer
        avgRiskScore:
          type: number
          format: float
        maxRiskScore:
          type: integer
        decisions:
          type: object
          properties:
            allow:
              type: integer
            review:
              type: integer
            block:
              type: integer

    # ── NHI (L3) ──
    NhiIdentity:
      type: object
      properties:
        agentId:
          type: string
        publicKey:
          type: string
          description: Hex-encoded HMAC-SHA256 public key
        workspaceId:
          type: string
        capabilities:
          type: array
          items:
            type: string
        registeredAt:
          type: string
          format: date-time

    RegisterIdentityBody:
      type: object
      required: [agentId]
      properties:
        agentId:
          type: string
        workspaceId:
          type: string
        capabilities:
          type: array
          items:
            type: string
          default: []

    AttestBody:
      type: object
      required: [agentId, challenge]
      properties:
        agentId:
          type: string
        challenge:
          type: string
          description: Challenge string to sign

    AttestationResult:
      type: object
      properties:
        agentId:
          type: string
        challenge:
          type: string
        signature:
          type: string
          description: Hex-encoded HMAC-SHA256 signature
        verified:
          type: boolean

    IssueTokenBody:
      type: object
      required: [agentId, capabilities]
      properties:
        agentId:
          type: string
        capabilities:
          type: array
          items:
            type: string
        ttlSeconds:
          type: integer
          default: 3600
          minimum: 1
          maximum: 31536000
          description: >
            Token lifetime in seconds, 1 second to one year. Outside that range
            the mint is refused with 400: a negative value produced a token the
            API reported `valid: true` while every check rejected it as expired,
            and a value large enough to push the expiry past year 9999 produced
            one that could not be rendered back at all. Revoke early with
            `DELETE /v1/nhi/tokens/{tokenId}`.

    CapabilityToken:
      type: object
      properties:
        tokenId:
          type: string
        agentId:
          type: string
        capabilities:
          type: array
          items:
            type: string
        issuedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        signature:
          type: string

    # ── Risk (L4) ──
    RiskWeights:
      type: object
      description: >
        Adaptive signal weights (normalized to sum 1). Process-global across
        ALL agents on the instance: feedback shifts them for everyone.
      required: [stat, context, behavioral, temporal, reputation]
      properties:
        stat:
          type: number
          format: double
        context:
          type: number
          format: double
        behavioral:
          type: number
          format: double
        temporal:
          type: number
          format: double
        reputation:
          type: number
          format: double

    FeedbackBody:
      type: object
      required: [feedback]
      properties:
        feedback:
          type: string
          description: Feedback signal (e.g. "too_strict", "too_lenient")

    RiskFeedbackResponse:
      type: object
      properties:
        applied:
          type: string
        weights:
          $ref: "#/components/schemas/RiskWeights"

    # ── Sandbox (L5) ──
    SandboxEntry:
      type: object
      properties:
        id:
          type: string
          format: uuid
        agentId:
          type: string
        toolName:
          type: string
        status:
          type: string
          enum: [pending, approved, rejected]
        payload:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time

    # ── Policy Verification (L6) ──
    PolicyVerificationResult:
      type: object
      properties:
        workspaceId:
          type: string
        valid:
          type: boolean
        findings:
          type: array
          items:
            type: string
        conflictsDetected:
          type: boolean

    # ── Firewall (L7) ──
    FirewallScanBody:
      type: object
      required: [text]
      properties:
        text:
          type: string
          description: Text to scan for prompt injection

    FirewallScanResult:
      type: object
      properties:
        clean:
          type: boolean
        threatLevel:
          type: string
          enum: [none, low, medium, high, critical]
        findings:
          type: array
          items:
            type: string
        patternsMatched:
          type: array
          items:
            type: string

    FirewallStats:
      type: object
      properties:
        totalScans:
          type: integer
        threatsDetected:
          type: integer
        threatsByLevel:
          type: object
          additionalProperties:
            type: integer

    # ── Telemetry (L8) ──
    TelemetrySpan:
      type: object
      properties:
        traceId:
          type: string
        spanId:
          type: string
        operationName:
          type: string
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        durationMs:
          type: number
        attributes:
          type: object
          additionalProperties: true

    TelemetryMetric:
      type: object
      properties:
        name:
          type: string
        value:
          type: number
        unit:
          type: string
        timestamp:
          type: string
          format: date-time
        attributes:
          type: object
          additionalProperties: true

    OtlpExportRecord:
      type: object
      properties:
        resourceSpans:
          type: array
          items:
            type: object
            additionalProperties: true
      description: OTLP-compatible export record

    # ── Demo ──
    DemoScenario:
      type: object
      required: [step, title, request]
      properties:
        step:
          type: string
        title:
          type: string
        request:
          $ref: "#/components/schemas/InspectRequest"

    DemoResult:
      type: object
      required: [step, title, decision, risk]
      properties:
        step:
          type: string
        title:
          type: string
        decision:
          $ref: "#/components/schemas/GovernanceDecision"
        risk:
          type: integer
          minimum: 0

    # ── Response Scanning ──
    ResponseDecision:
      type: string
      enum: [allow, review, block]
      description: >
        Verdict on a tool response, from a single blended risk score:
        `block` at 80 or above, `review` at 40 to 79, `allow` below 40.

    ResponseScanRequest:
      type: object
      required: [requestId, agentId, toolName, responsePayload]
      properties:
        requestId:
          type: string
          description: Caller-chosen correlation id, echoed back in the result
        agentId:
          type: string
          description: Agent the response is attributed to
        toolName:
          type: string
          description: Tool that produced the response
        responsePayload:
          description: The tool response to scan (any JSON value)
        metadata:
          type: object
          additionalProperties: true
          description: Optional; `sessionId` is the only key the server reads

    ResponseScanResult:
      type: object
      required: [requestId, decision, riskScore, findings]
      properties:
        requestId:
          type: string
        decision:
          $ref: "#/components/schemas/ResponseDecision"
        riskScore:
          type: integer
          minimum: 0
          maximum: 100
        findings:
          type: array
          items:
            type: string
          description: Human-readable findings, one line per detection
        redactedPayload:
          description: >
            Present only when sensitive patterns matched; each match is replaced
            by a redaction marker.

    SensitivePattern:
      type: object
      required: [name, description, category]
      properties:
        name:
          type: string
          description: Human-readable pattern name
        description:
          type: string
        category:
          type: string
          enum: [pii, financial, credential]

    # ── Rate Limiting ──
    RateLimitStatus:
      type: object
      required: [agentId, requestsLastMinute, requestsLastHour, requestsLast5Seconds, config]
      properties:
        agentId:
          type: string
        requestsLastMinute:
          type: integer
          description: >
            Requests recorded in the last 60 seconds, as the maximum over the
            agent's per-tool windows. The limit is enforced per agent and tool,
            so this is the number comparable to `config.maxPerMinute`: when they
            are equal, the next call on that tool is refused.
        requestsLastHour:
          type: integer
          description: Same, over the last hour, comparable to `config.maxPerHour`.
        requestsLast5Seconds:
          type: integer
          description: Same, over the burst window, comparable to `config.burstLimit`.
        config:
          $ref: "#/components/schemas/RateLimitConfig"

    RateLimitConfig:
      type: object
      required: [maxPerMinute, maxPerHour, burstLimit]
      description: >
        The global rate-limit configuration. All three fields are required —
        they carry no server-side default on deserialization, so a body missing
        any of them is rejected with 422. Limits are enforced per agent and tool.
      properties:
        maxPerMinute:
          type: integer
          minimum: 0
          description: Requests allowed per agent and tool in a 60-second sliding window (default 60)
        maxPerHour:
          type: integer
          minimum: 0
          description: Requests allowed per agent and tool in a one-hour sliding window (default 1000)
        burstLimit:
          type: integer
          minimum: 0
          description: Requests allowed per agent and tool in a 5-second sliding window (default 10)

    # ── Agent Fingerprinting ──
    AgentFingerprint:
      type: object
      properties:
        agentId:
          type: string
        toolDistribution:
          type: object
          additionalProperties:
            type: integer
          description: Map of tool names to usage counts
        actionTypeDistribution:
          type: object
          additionalProperties:
            type: integer
          description: Map of action types to usage counts
        avgTimeBetweenActions:
          type: number
          format: float
          description: Average time between actions in milliseconds
        totalActions:
          type: integer
        firstSeenAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
        anomalyScore:
          type: number
          format: float
          description: Current anomaly score (0.0 = normal, 1.0 = highly anomalous)

    # ── Threat Intelligence ──
    ThreatIndicator:
      type: object
      required: [indicatorType, value]
      properties:
        id:
          type: string
          format: uuid
        indicatorType:
          type: string
          enum: [ip, domain, hash, url, pattern]
          description: Type of threat indicator
        value:
          type: string
          description: The indicator value (IP address, domain, hash, etc.)
        description:
          type: string
        severity:
          type: string
          enum: [low, medium, high, critical]
        source:
          type: string
          description: Where this indicator came from
        createdAt:
          type: string
          format: date-time

    ThreatIntelStats:
      type: object
      properties:
        totalIndicators:
          type: integer
        indicatorsByType:
          type: object
          additionalProperties:
            type: integer
        indicatorsBySeverity:
          type: object
          additionalProperties:
            type: integer
        totalChecks:
          type: integer
        totalMatches:
          type: integer

    ThreatIntelCheckRequest:
      type: object
      required: [value]
      properties:
        value:
          type: string
          description: Value to check against threat indicators
        indicatorType:
          type: string
          enum: [ip, domain, hash, url, pattern]
          description: Optional filter to check against specific indicator type

    ThreatIntelCheckResult:
      type: object
      properties:
        matched:
          type: boolean
        matchedIndicators:
          type: array
          items:
            $ref: "#/components/schemas/ThreatIndicator"

    # ── Audit stats & analytics ──
    AuditStats:
      type: object
      required: [totalEvents, decisions, topAgents, topTools, avgRiskScore]
      properties:
        totalEvents:
          type: integer
        decisions:
          type: object
          additionalProperties:
            type: integer
          description: Event count per decision (allow/review/block)
        topAgents:
          type: array
          items:
            type: array
            prefixItems:
              - type: string
              - type: integer
            description: "[agentId, eventCount] pair"
        topTools:
          type: array
          items:
            type: array
            prefixItems:
              - type: string
              - type: integer
            description: "[toolName, eventCount] pair"
        avgRiskScore:
          type: number
          format: double

    AgentAnalytics:
      type: object
      required: [agentId, totalRequests, decisions, avgRiskScore, topTools, lastActivity, trustScore]
      properties:
        agentId:
          type: string
        totalRequests:
          type: integer
        decisions:
          type: object
          additionalProperties:
            type: integer
        avgRiskScore:
          type: number
          format: double
        topTools:
          type: array
          items:
            type: array
            prefixItems:
              - type: string
              - type: integer
            description: "[toolName, useCount] pair"
        lastActivity:
          type: string
          format: date-time
        trustScore:
          type: number
          format: double

    # ── Webhook DLQ ──
    DeadLetterEntry:
      type: object
      required: [id, webhookId, webhookUrl, eventType, payload, error, attempts, failedAt]
      properties:
        id:
          type: string
        webhookId:
          type: string
        webhookUrl:
          type: string
          format: uri
        eventType:
          type: string
        payload:
          type: object
          additionalProperties: true
        error:
          type: string
        attempts:
          type: integer
        failedAt:
          type: string
          format: date-time

    # ── Templates & rules ──
    TemplateListResponse:
      type: object
      required: [templates, count]
      properties:
        templates:
          type: array
          items:
            type: object
            properties:
              templateId:
                type: string
              name:
                type: string
              description:
                type: string
              category:
                type: string
              builtin:
                type: boolean
              rulesCount:
                type: integer
              toolsCount:
                type: integer
        count:
          type: integer

    TemplateDetail:
      type: object
      properties:
        templateId:
          type: string
        name:
          type: string
        description:
          type: string
        category:
          type: string
        builtin:
          type: boolean
        workspace:
          $ref: "#/components/schemas/WorkspacePolicy"
        rules:
          type: array
          items:
            $ref: "#/components/schemas/PolicyRule"

    PolicyRule:
      type: object
      required: [id, name, decision]
      properties:
        id:
          type: string
        name:
          type: string
        priority:
          type: integer
          default: 0
          description: Lower = evaluated first
        matchCriteria:
          type: object
          additionalProperties: true
          description: Criteria the request must match for the rule to apply
        conditions:
          type: object
          additionalProperties: true
          description: Additional conditions that must hold
        decision:
          $ref: "#/components/schemas/GovernanceDecision"
        reason:
          type: string
        enabled:
          type: boolean
          default: true

    WorkspaceRulesResponse:
      type: object
      required: [rules, count]
      properties:
        rules:
          type: array
          items:
            $ref: "#/components/schemas/PolicyRule"
        count:
          type: integer

    # ── Plugins ──
    PluginRegistrySnapshot:
      type: object
      required: [pluginDir, plugins, loadErrors, loadedCount]
      properties:
        pluginDir:
          type: string
        plugins:
          type: array
          items:
            type: object
            additionalProperties: true
            description: Plugin manifest (name, sha256, attestation when enabled)
        loadErrors:
          type: array
          items:
            type: object
            additionalProperties: true
        loadedCount:
          type: integer

    # ── Receipts (M2) ──
    ReceiptsListResponse:
      type: object
      required: [enabled, signerKeyId, policyHash, runs]
      properties:
        enabled:
          type: boolean
          description: False when the host was built/run without receipts
        signerKeyId:
          type: string
          description: Stable signer identity (`ed25519-<hex16>`)
        policyHash:
          type: string
          description: >
            The receipt logger's CONFIGURED policy hash, which is not necessarily
            the `policy_hash` inside the receipts listed below. A receipt records
            the hash that governed that request; this field records what the
            logger was started with, and on a default build that is still the M2
            placeholder `sha256("iaga-sentinel-policy-v0")`. The two disagreeing
            is expected, not corruption — do not treat this value as a statement
            about the runs in `runs[]`.
        runs:
          type: array
          description: >
            NOTE the field names inside `runs[]` are snake_case, unlike the rest
            of this API. `RunSummary` (crates/iaga-sentinel-receipts) carries no
            `rename_all = "camelCase"`, so it has served these names since the
            route shipped in 2.0.2. The spec documented the camelCase forms it
            ought to have used, which meant a client generated from it read
            `undefined` for every field of every run. The spec is corrected here
            rather than the server, because renaming a response that has already
            shipped would silently break existing integrations for a cosmetic
            gain; the enclosing object stays camelCase.
          items:
            type: object
            properties:
              run_id:
                type: string
              receipt_count:
                type: integer
              first_timestamp:
                type: string
              last_timestamp:
                type: string
              terminal_verdict:
                $ref: "#/components/schemas/GovernanceDecision"

    ReceiptRunResponse:
      type: object
      required: [enabled, receipts]
      properties:
        enabled:
          type: boolean
        receipts:
          type: array
          items:
            type: object
            additionalProperties: true
            description: >
              Signed receipt (canonical snake_case body + hex Ed25519
              signature). The byte-exact schema is defined by
              `iaga-sentinel-receipts::ReceiptBody` and frozen by
              golden-vector tests.
        verify:
          type: object
          additionalProperties: true
          description: Chain verification outcome for the run
        receiptDropped:
          type: boolean
          description: >
            True when at least one signed receipt for this run was lost to an
            append error or retry exhaustion, so the SQL audit trail and the
            signed chain diverge (issue #23). `verify` above reflects only the
            receipts that are present and can report valid despite the gap.
        droppedReceipts:
          type: integer
          description: Count of receipts dropped for this run (0 when none).

    # ── Cost control (1.5) ──
    CostSummaryResponse:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
          description: False when compiled without `cost-control`
        summary:
          type: object
          properties:
            grossCostUsd:
              type: number
              format: double
              description: net + savings
            netCostUsd:
              type: number
              format: double
            savingsUsd:
              type: number
              format: double
            cacheHits:
              type: integer
            totalTokens:
              type: integer
            pricedActions:
              type: integer
          additionalProperties: true

    CostRowsResponse:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
        rows:
          type: array
          items:
            type: object
            additionalProperties: true
            description: Aggregation row (key fields + costUsd/tokens counters)

    CostOverTimeResponse:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
        bucket:
          type: string
          enum: [hour, day]
        rows:
          type: array
          items:
            type: object
            additionalProperties: true

    CostBudgetResponse:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
        sessionLimitUsd:
          type: number
          format: double
          nullable: true
          description: IAGA_SENTINEL_SESSION_BUDGET_USD, null when unset

    CostPricingResponse:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
        pricing:
          type: object
          additionalProperties: true
          description: Active PricingTable (providers → model → per-Mtok USD rates)
        builtinEffectiveDate:
          type: string
          format: date
          description: Date the BUILT-IN price list was last verified (1.5.2)

    # ── Pillar status ──
    PolicyOverlayStatus:
      type: object
      required: [enabled, loaded, policyCount]
      properties:
        enabled:
          type: boolean
          description: False when compiled without the `dictum` feature
        loaded:
          type: boolean
        policyCount:
          type: integer
        policyHash:
          type: string
          nullable: true
        source:
          type: string
          nullable: true
          description: Path of the loaded .dictum bundle

    ReasoningStatus:
      type: object
      required: [enabled, engine, models, mlFeatureCompiled]
      properties:
        enabled:
          type: boolean
        engine:
          type: string
          example: tract
        models:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              sha256:
                type: string
        mlFeatureCompiled:
          type: boolean

    KernelStatus:
      type: object
      required: [enabled, backend, authoritative, linuxBpfScaffold]
      properties:
        enabled:
          type: boolean
        backend:
          type: string
          example: userspace
        authoritative:
          type: boolean
          description: >
            Honest posture flag: always false in the open build (userspace
            soft enforcement; the eBPF/LSM scaffold has no loader).
        linuxBpfScaffold:
          type: boolean
