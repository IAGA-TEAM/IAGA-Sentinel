  /v1/nhi/tokens:
    get:
      operationId: listCapabilityTokens
      summary: List outstanding capability tokens
      description: >
        Every stored token, newest first. Admin-scoped. The `signature` is NOT
        returned: it is the server's own HMAC over the stored row, recomputed
        from the agent's derived secret on every check, so publishing it would
        hand out a valid MAC under that secret next to the plaintext it covers
        — and an inventory does not need it. On the wire the token **id** is the
        bearer half.

        Added in 2.1.0. Minting and revoking both take an id the caller already
        holds, so a token could previously only be withdrawn if someone had
        written its id down at mint time: "what is currently authorized" had no
        answer. `valid` goes false on revocation; an EXPIRED token can still
        read `valid: true` until the cleanup sweep drops the row (every 300s by
        default, `IAGA_SENTINEL_CLEANUP_INTERVAL_SECS`), so compare `expiresAt`
        rather than trusting `valid` alone.
      tags: [NHI]
      responses:
        "200":
          description: Outstanding tokens
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [tokenId, agentId, capabilities, issuedAt, expiresAt, valid]
                  properties:
                    tokenId:
                      type: string
                    agentId:
                      type: string
                    capabilities:
                      type: array
                      items:
                        type: string
                    issuedAt:
                      type: string
                      format: date-time
                    expiresAt:
                      type: string
                      format: date-time
                    valid:
                      type: boolean
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AdminScopeRequired"
    post:
      operationId: issueCapabilityToken
      summary: Issue a time-limited capability token for an agent
      description: >
        Mints a capability token bound to one `agentId`. Admin-scoped (2.1.0):
        the route had no guard, so any agent-scoped key could mint
        `capabilities: ["*"]` for any agent. The token is signed with the
        agent's derived NHI secret and persisted, so it survives a restart and
        can be revoked fleet-wide.


        Present it in the `X-IAGA-Capability-Token` header alongside the
        ordinary `Authorization` bearer key. `read:self` lets an agent read its
        own `/v1/profiles/{agentId}` and `/v1/analytics/agents/{agentId}`, which
        are otherwise admin-only. A token can never read another agent's data,
        whatever capabilities it carries.
      tags: [NHI]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IssueTokenBody"
      responses:
        "201":
          description: Issued capability token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapabilityToken"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AdminScopeRequired"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/nhi/tokens/{tokenId}:
    delete:
      operationId: revokeCapabilityToken
      summary: Revoke a capability token
      description: >
        Marks the token invalid. Durable and fleet-wide, because the stored row
        is the authority and there is no in-process cache to go stale. New in
        2.1.0: revocation was implemented but had no route, so a token could be
        minted and never withdrawn.
      tags: [NHI]
      parameters:
        - name: tokenId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Token revoked
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AdminScopeRequired"
        "404":
          $ref: "#/components/responses/NotFound"

