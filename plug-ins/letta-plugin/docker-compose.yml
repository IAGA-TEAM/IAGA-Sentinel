# Drop-in quickstart: a stock IAGA Sentinel sidecar (open mode, no auth) plus an
# open-source Letta server. For local demos only.
#
#   docker compose up sentinel letta      # sidecar on :4010, Letta on :8283
#
# Open mode (IAGA_SENTINEL_OPEN_MODE=true) and SECURE=false are for local demos.
# In production, drop open mode and mint a server key (`iaga gen-key`, or
# IAGA_SENTINEL_BOOTSTRAP_API_KEY on the sidecar; the plug-in then sends it as
# IAGA_SENTINEL_API_KEY, which is the client-side name). Also set SECURE=true
# with a LETTA_SERVER_PASSWORD. Letta needs an LLM key (e.g. OPENAI_API_KEY) to give
# the agent a brain — pass it through the `letta` service environment.
services:
  sentinel:
    # Built from this repo, not pulled: no image is published yet (see the root
    # README). Compose builds it on first `up` and reuses the tag afterwards.
    image: iaga-sentinel:local
    build:
      context: ../..
    command: ["serve"]
    environment:
      IAGA_SENTINEL_OPEN_MODE: "true"
      PORT: "4010"
    # Loopback-only publish: open mode makes every unauthenticated caller an implicit
    # ADMIN, so a bare "4010:4010" would expose the signed decision log to the LAN.
    ports:
      - "127.0.0.1:4010:4010"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4010/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  letta:
    image: letta/letta:latest
    environment:
      SECURE: "false"
      # OPENAI_API_KEY: "sk-..."   # or ANTHROPIC_API_KEY, etc. — the agent's brain
    # Loopback-only publish: SECURE=false above means this Letta server has no auth
    # at all, and this demo approves a `run_shell` tool.
    ports:
      - "127.0.0.1:8283:8283"
    volumes:
      - letta-pgdata:/var/lib/postgresql/data

volumes:
  letta-pgdata:
